# Checks every push and pull request: the tests and a production build (which typechecks).
# Deploying is separate: Cloudflare Pages builds and publishes the site itself (see the README).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
